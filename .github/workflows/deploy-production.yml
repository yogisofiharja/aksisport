name: Deploy production

on:
  push:
    branches: [production]
    paths:
      - 'server/**'
      - 'src/**'
      - 'components/**'
      - 'App.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/production/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Reset checkout to latest production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/aksi-production
            git fetch origin
            git reset --hard origin/production

      - name: Build and restart production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /opt/aksi-production/deploy/production/deploy.sh
